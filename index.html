function nestView(){let tab=state.tab.Nest||'Companions',tabs=['Companions','Garden','Cozy shop','Room','Stickers'];let b='';if(tab==='Companions')b=`<h2>Choose a little company</h2><div class="grid">${state.data.companions.companions.map(c=>card(`<div class="row"><span class="companion">${animal(c.name)}</span><span class="chip">${c.name===state.companion?'Here with you':c.name}</span></div><h3>${c.name}</h3><p>${c.role}</p><div class="bubble">${c.speech[0]}</div><button class="softbtn" data-action="companion" data-value="${c.name}" style="margin-top:12px">${c.name===state.companion?'Your companion':'Invite to room'}</button>`,'span4')).join('')}</div>`;

function settingsView(){let t=state.data.settings.toggles;return `${head('SETTINGS','Make it feel like <span class="accent">yours</span>.','A few gentle choices, saved privately on this device.') }<div class="grid">${card(`<h2>Themes · 8</h2><div class="themegrid">${state.data.themes.names.map(n=>`<button class="themechoice ${state.theme===n?'selected':''}" data-action="theme" data-value="${n}">${n}</button>`).join('')}</div><div class="field"><label>Currency</label><select id="currency">${state.data.themes.currencies.map(c=>`<option ${state.currency===c?'selected':''}>${c}</option>`).join('')}</select></div><div class="field"><label>Text size</label><select id="textsize">${state.data.themes.text_sizes.map(c=>`<option ${state.textSize===c?'selected':''}>${c}</option>`).join('')}</select></div><button class="btn" data-action="applysettings">Apply preferences</button>`,'span6')}${card(`<h2>Comfort</h2><div class="listrow"><span style="flex:1"><b>Gentle return</b><small class="taskmeta">A kind welcome back after a pause</small></span><span class="chip">${state.data.themes.gentle_return_days} days</span></div>${Object.entries(t).map(([k,v])=>`<div class="listrow"><span style="flex:1">${k.replaceAll('_',' ')}</span><input type="checkbox" data-toggle="${k}" ${v?'checked':''}></div>`).join('')}`,'span6')}${card(`<h2>Trackers & modules</h2><p>Trackers</p>${Object.entries(state.data.settings.trackers).map(([k,v])=>`<div class="listrow"><span style="flex:1">${k}</span><input type="checkbox" ${v?'checked':''} data-tracker="${k}"></div>`).join('')}<p>Modules</p>${Object.entries(state.data.settings.modules).map(([k,v])=>`<div class="listrow"><span style="flex:1">${k}</span><input type="checkbox" ${v?'checked':''} data-module="${k}"></div>`).join('')}`,'span6')}${card(`<h2>Your data</h2><p>On-device storage only. Move your planner with a backup file.</p><div class="row"><button class="btn" data-action="backup">Export backup</button><button class="softbtn" data-action="restore">Re ${t.steps.map(s=>`<div class="listrow">☐ ${s}</div>`).join('')}<p>Where I left off: ${t.resume_note||'A fresh start is fine.'}</p>`,`<button class="softbtn" data-action="closemodal">Close</button><button class="btn" data-action="task-edit" data-id="${id}">Edit task</button>`);break;}case'taskedit':close();newTask(id);break;case'focusstart':state.focus.running=true;state.focus.startedAt=Date.now();state.screen='Plan';state.tab.Plan='Tasks';modal('Focus room',focusHTML(),'<button class="softbtn" data-action="focuspause">Pause</button><button class="btn" data-action="focusfinish">Finish interval</button>');break;case'focuspause':state.focus.running=false;modal('A quiet pause',`<p>Where should I pick this up?</p><div class="field"><label>Note</label><textarea>${state.data.today.oneThing.resume_note}</textarea></div><div class="field"><label>Next small step</label><input value="Draft the winter fair paragraph"></div><p>Your task stays open until you choose to complete it.</p>`,'<button class="btn" data-action="closemodal">Save pause</button>');break;case'focusfinish':state.focus.running=false;state.focus.remaining=1500;state.focus.visits++;state.focus.confirmed+=5;state.acorns++;close();toast('Focus interval saved · 5 minutes confirmed');break;case'smaller':modal('Make today smaller',`<div class="field"><label>Time for tasks (minutes)</label><input id="smalltime" type="number" value="75"></div><div class="field"><label>Effort preference</label><select><option>Any</option><option>Low</option><option>Medium</option><option>High</option></select></div><p>155 minutes before / 75 selected task minutes</p><div class="listrow"><b>Keep:</b> Draft the community newsletter · 65 min · Hard deadline preserved</div><div class="listrow"><b>Make smaller:</b> Pick a quick lunch · 10 min</div><div class="listrow"><b>Move out:</b> Tidy the reading corner · 35 min; Water the balcony herbs · 15 min</div><p class="small">Tea with Priya (16:00–16:45) stays fixed. Hard deadlines stay unchanged. Accepting is one change, with one undo.</p>`,'<button class="softbtn" data-action="closemodal">Not now</button><button class="btn" data-action="smaller-accept">Accept one change</button>');break;case'acceptsmaller':close();toast('Today made a little smaller. Undo is available.');break;case'mood':state.mood=v;state.acorns++;toast('Check-in saved · 1 acorn');break;case'water':state.water++;state.acorns++;toast('A glass recorded · 1 acorn');break;case'waterremove':state.water=Math.max(0,state.water-1);break;case'star':state.stars++;state.acorns++;toast('A star folded · 1 acorn');break;case'checkin':modal('Gentle check-in',`<div class="field"><label>Date</label><input type="date" value="2026-11-21"></div><div class="field"><label>Mood</label><select>${state.data.wellbeing.moodOptions.map(m=>`<option>${m}</option>`).join('')}</select></div><div class="field"><label>Optional note</label><textarea></textarea></div><div class="field"><label>Glasses of water</label><input type="number" value="${state.water}"></div><div class="field"><label>Good things (one per line)</label><textarea></textarea></div><div class="field"><label>Bedtime · Wake time</label><input placeholder="22:30 – 06:30"></div><div class="field"><label>Sleep quality</label><select><option>Restful</option><option>Mixed</option><option>Restless</option></select></div>`,'<button class="btn" data-action="checkin-save">Save check-in</button>');break;case'habitrecord':{let h=state.data.habits.habits.find(x=>x.id===id);modal(`Record · ${h.name}`,`<div class="stack">${['Completed','Partly done','Deliberately skipped','Missed','Paused'].map(x=>`<button class="softbtn" data-action="habitstatus" data-value="${x}" data-id="${id}">${x}</button>`).join('')}</div>`);break;}case'habitstatus':state.habitRecords[id]=v;state.acorns+=2;close();toast(v+' recorded · 2 acorns');break;case'habitdetail':{let h=state.data.habits.habits.find(x=>x.id===id);modal(h.name,`<p>Weekly target ${h.target_per_week} · This week ${h.this_week_do n class="btn" data-action="closemodal">Plant seed</button>');break;case'buy':{let it=state.data.shop.items[+el.dataset.index];if(state.acorns>=it.price){state.acorns-=it.price;state.shopOwned.push(it.name);state.roomItems.push(it.name);toast(it.name+' bought & placed');}else toast('A few more acorns first.');break;}case'place':{let item=$('#roomitem')?.value;state.roomUndo=[...state.roomItems];if(item&&!state.roomItems.includes(item))state.roomItems.push(item);toast('Placed in your room');break;}case'undo':if(state.roomUndo){state.roomItems=state.roomUndo;state.roomUndo=null;toast('Your previous arrangement is back');}break;case'theme':state.theme=v;break;case'applysettings':state.currency=$('#currency').value;state.textSize=+$(' #textsize'.trim()).value;break;case'backup':downloadBackup();break;case'restore':$('#restorefile').click();break;case'empty':if(confirm('Start with an empty file? Your example numbers will be cleared from this device.')){localStorage.removeItem(KEY);state=clone(initial);state.data.today.tasks=[];state.data.today.oneThing={title:'A fresh beginning',minutes:15,resume_note:'Choose one small step.'};state.acorns=0;toast('A fresh, empty planner is ready.');}break;case'simple':state.simple=true;break;case'simpleoff':state.simple=false;state.screen='Today';break;case'quickadd':modal('Something on your mind?',`<div class="field"><textarea id="capturetext" placeholder="Write it down. You can sort it later."></textarea></div>`,'<button class="btn" data-action="capture">To inbox</button>');break;case'capture':{let val=$('#capturetext').value.trim();if(val){state.data.today.tasks.push({id:'new'+Date.now(),title:val,minutes:15,area:'Personal',effort:'low',steps:[]});state.acorns++;}close();toast('Captured safely in your plans');break;}case'newtask':newTask();break;case'newnote':modal('A new note',`<div class="field"><label>Title</label><input id="notetitle"></div>`,'<button class="btn" data-action="savenote">Save note</button>');break;case'savenote':sta function appointmentOccurs(a,key){if(a.date===key)return true;if(!a.repeat||a.repeat==='Does not repeat'||key<a.date)return false;let x=new Date(a.date+'T12:00:00'),y=new Date(key+'T12:00:00'),days=Math.round((y-x)/86400000);if(a.repeat==='Daily')return days%1===0;if(a.repeat==='Weekly')return days%7===0;if(a.repeat==='Monthly · same date')return x.getDate()===y.getDate();if(a.repeat==='Yearly · same date')return x.getMonth()===y.getMonth()&&x.getDate()===y.getDate();return false}

document.addEventListener('dragstart',e=>{let x=e.target.closest('[data-room-item]');if(x){state.dragItem=x.dataset.roomItem;e.dataTransfer.setData('text/plain',state.dragItem)}});

document.addEventListener('drop',e=>{let slot=e.target.closest('[data-room-slot]');if(!slot)return;e.preventDefault();let name=e.dataTransfer.getData('text/plain')||state.dragItem,it=state.data.shop.items.find(x=>x.name===name);if(!it)return;let compatible=it.category==='Rug'?'Floor':it.category;if(compatible!==slot.dataset.roomSlot&&!(slot.dataset.roomSlot==='Floor'&&it.category==='Floor')){toast('That item belongs in a different slot');return}state.roomUndo={items:[...state.roomItems],slots:clone(state.plantSlots)};state.plantSlots[name]=slot.dataset.roomSlot;if(!state.roomItems.includes(name))state.roomItems.push(name);persist();render()});

document.addEventListener('click',e=>{let s=e.target.closest('[data-screen]');if(s){state.screen=s.dataset.screen;state.simple=false;render();return}let tab=e.target.closest('[data-tab]');if(tab){state.tab[state.screen]=tab.dataset.tab;render();return}let b=e.target.closest('[data-action]');if(b){act(b.dataset.action,b);render();}});
document.addEventListener('change',e=>{if(e.target.dataset.toggle){state.data.settings.toggles[e.target.dataset.toggle]=e.target.checked;save()}if(e.target.dataset.tracker){state.data.settings.trackers[e.target.dataset.tracker]=e.target.checked;save()}if(e.target.dataset.module){state.data.settings.modules[e.target.dataset.module]=e.target.checked;save()}if(e.target.id==='restorefile'&&e.target.files[0]){let r=new FileReader();r.onload=()=>{try{state=JSON.parse(r.result);render();toast('Backup restored on this device')}catch{toast('That backup could not be read')}};r.readAsText(e.target.files[0])}});
